
[platformio]
default_envs = genericSTM32F405RG

[env:genericSTM32F405RG]
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
extra_scripts = pre:scripts/unlock_before_upload.py
; uClock integration: using local stub for compile-only; replace with midilab/uClock@^2.3.0 when ready for runtime
; Set PIO_UPLOAD_RECOVERY=1 only when you need to clear readout protection.

upload_protocol = stlink
debug_tool = stlink
build_type = release
build_unflags = -Os -O1 -O2 -O3
monitor_speed = 115200

build_flags =
    -O3
    -DSTM32F405xx
    -DUSE_HAL_DRIVER
    -DHARDWARE_BUILD
    -DS12_USE_UCLOCK_MUSICAL_STEP_CLOCK=1
    -DUCLOCK_STM32_CUBE_HAL
    -I./platform/uclock
    -DST7789_ROTATION=3
    -DLCD_USE_18BIT_COLOR=0
    -DST7789_USE_DMA=1
    -DST7789_CS_ALWAYS_ACTIVE=1
    -DST7789_CS_ACTIVE_LOW=1
    -DST7789_COLOR_ORDER_BGR=0
    -DST7789_INVERT_DEFAULT=1
    -DMCP_MINIMAL_DEBUG=0
    ; SPI1 on APB2 = 84 MHz: /2=42, /4=21, /8=10.5 MHz
    ; /2 verified clean on PCB (2026-07). Out of ST7789 spec (15 MHz) but
    ; standard practice; if artifacts ever appear, fall back to /4 first.
    -DST7789_SPI1_PRESCALER=SPI_BAUDRATEPRESCALER_2
    -DX_SHIFT=0
    -DY_SHIFT=0
    -I.
    -Icore
    -Idevices
    -Iplatform
    -Istm32
    -Istm32/hw
    -Iplatform/mcp23017
    -Iui

build_src_filter =
    -<*>
    -<../ui/calibration.c>
    +<../stm32/*.c>
    -<../stm32/fram_pattern_forensic_main.c>
    +<../stm32/hw/*.c>
    +<../platform/mcp23017/*.c>
    +<../platform/dac8564/*.c>
    +<../platform/fram/*.c>
    +<../platform/fram/*.cpp>
    +<../platform/midi/*.cpp>
    +<../platform/uclock/*.cpp>
    +<../core/*.cpp>
    +<../devices/sequencer/*.cpp>
    +<../devices/sequencer/chords/*.cpp>
    +<../ui/*.c>
    +<../ui/sequencer_clipboard.cpp>
    +<../ui/screens/*.c>
    +<../stm32/sequencer_bridge.cpp>
    +<../stm32/storage_boot.cpp>
    +<../stm32/sequencer_output_snapshot.cpp>
    +<../stm32/time_commit_probe.cpp>
    +<../stm32/user_chord_bridge.cpp>

[env:genericSTM32F405RG_recovery]
extends = env:genericSTM32F405RG
extra_scripts = pre:scripts/recovery_unlock_only.py
build_src_filter = -<*>
targets = recover_unlock

; Temporary, removable: read-only MB85RC256 backup/dump build.
; Never writes/erases/formats FRAM; halts after reading 0x0000-0x7FFF into RAM.
[env:genericSTM32F405RG_frambackup]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_FRAM_BACKUP_MODE=1

; Temporary, removable: read-only MB85RC1MT probe build.
; Never writes/erases/formats FRAM; only proves bank 0 (0x50) and bank 1 (0x51) respond.
[env:genericSTM32F405RG_newchiptest]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_FRAM_NEWCHIP_TEST_MODE=1

; Temporary, removable: full 128 KiB MB85RC1MT read-only backup/CRC build.
; Compiles an isolated main and exposes a 4 KiB SRAM extraction window.
[env:genericSTM32F405RG_framfullbackup]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_FRAM_FULL_BACKUP_MODE=1
build_src_filter =
    -<*>
    +<../stm32/fram_full_backup_main.c>
    +<../stm32/hw/hw_init.c>
    +<../stm32/stm32f4xx_hal_msp.c>
    +<../platform/fram/mb85rc1mt.c>
    +<../platform/fram/fram_full_backup.c>

; Temporary forensic acquisition: reads only Pattern 1 and PatternStore journal into SRAM.
; Isolated from sequencer_bridge, PatternStore, bootstrap, recovery, and persistence service.
[env:genericSTM32F405RG_patternforensic]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
build_src_filter =
    -<*>
    +<../stm32/fram_pattern_forensic_main.c>
    +<../stm32/hw/hw_init.c>
    +<../stm32/stm32f4xx_hal_msp.c>
    +<../platform/fram/mb85rc1mt.c>

; One-shot recovery of the already-validated PatternStore journal, followed only by reads.
; Isolated from production bridge/startup/persistence service; does not factory initialize.
[env:genericSTM32F405RG_patternrecovery]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
build_src_filter =
    -<*>
    +<../stm32/fram_pattern_recovery_main.cpp>
    +<../stm32/hw/hw_init.c>
    +<../stm32/stm32f4xx_hal_msp.c>
    +<../platform/fram/mb85rc1mt.c>
    +<../platform/fram/pattern_store.cpp>

; Temporary, removable: MB85RC1MT restore build.
; Writes/verifies ONLY 0x0000-0x7FFF from a buffer pre-loaded via OpenOCD load_image.
[env:genericSTM32F405RG_framrestore]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_FRAM_RESTORE_MODE=1

; Temporary, removable: Pattern-store Stage 1 round-trip test build.
; Writes/reads/verifies ONLY one slot in the new 0x8000+ pattern-store region.
[env:genericSTM32F405RG_patternstoretest]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_PATTERNSTORE_TEST_MODE=1

; Temporary, removable: timing-instrumented production build (test A).
; Full production behaviour + DWT-based max-duration probes, Stage 2 shadow-write ACTIVE.
[env:genericSTM32F405RG_timingprobe]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_TIMING_PROBE_ENABLE=1

; Temporary, removable: same as above but Stage 2 shadow-write DISABLED (test B, A/B compare).
[env:genericSTM32F405RG_timingprobe_noshadow]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_TIMING_PROBE_ENABLE=1
    -DS12_DISABLE_SHADOW_PERSIST=1

; Temporary RAM-only TIME commit/I2C/cache/backlog timing instrumentation.
; Does not write diagnostic values to FRAM or change persistence behavior.
[env:genericSTM32F405RG_timecommitprobe]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_TIME_COMMIT_PROBE=1

; Temporary, removable: full production build + PatternStore read-side verify-all
; diagnostic, armed on-demand by writing g_ps_verify_trigger=1 over SWD. Otherwise
; behaves identically to production -- no automatic writes, no playback changes.
[env:genericSTM32F405RG_patternstoreverify]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_PATTERNSTORE_VERIFYALL_ENABLE=1

; Temporary, removable: current+next Pattern cache validation pilot.
; Diagnostic/shadow only -- resident song_.patterns[] stays authoritative,
; nothing here is read by playback. Runs every main-loop pass, unconditionally
; (no SWD arming needed, since it never writes/blocks more than one FRAM chunk).
[env:genericSTM32F405RG_patterncache]
extends = env:genericSTM32F405RG
build_flags =
    ${env:genericSTM32F405RG.build_flags}
    -DS12_PATTERNCACHE_PILOT_ENABLE=1