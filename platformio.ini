
[platformio]
default_envs = genericSTM32F405RG

[env:genericSTM32F405RG]
platform = ststm32
board = genericSTM32F405RG
framework = stm32cube
extra_scripts = pre:scripts/unlock_before_upload.py
; uClock integration: using local stub for compile-only; replace with midilab/uClock@^2.3.0 when ready for runtime
; Set PIO_UPLOAD_RECOVERY=1 only when you need to clear readout protection.

upload_protocol = stlink
debug_tool = stlink
build_type = release
build_unflags = -Os -O1 -O2 -O3
monitor_speed = 115200

build_flags =
    -O3
    -DSTM32F405xx
    -DUSE_HAL_DRIVER
    -DHARDWARE_BUILD
    -DS12_USE_UCLOCK_MUSICAL_STEP_CLOCK=0
    -DUCLOCK_STM32_CUBE_HAL
    -I./platform/uclock
    -DST7789_ROTATION=3
    -DLCD_USE_18BIT_COLOR=0
    -DST7789_USE_DMA=1
    -DST7789_CS_ALWAYS_ACTIVE=1
    -DST7789_CS_ACTIVE_LOW=1
    -DST7789_COLOR_ORDER_BGR=0
    -DST7789_INVERT_DEFAULT=1
    -DMCP_MINIMAL_DEBUG=0
    ; SPI1 on APB2 = 84 MHz: /2=42, /4=21, /8=10.5 MHz
    ; /2 verified clean on PCB (2026-07). Out of ST7789 spec (15 MHz) but
    ; standard practice; if artifacts ever appear, fall back to /4 first.
    -DST7789_SPI1_PRESCALER=SPI_BAUDRATEPRESCALER_2
    -DX_SHIFT=0
    -DY_SHIFT=0
    -I.
    -Icore
    -Idevices
    -Iplatform
    -Istm32
    -Istm32/hw
    -Iplatform/mcp23017
    -Iui

build_src_filter =
    -<*>
    -<../ui/calibration.c>
    +<../stm32/*.c>
    +<../stm32/hw/*.c>
    +<../platform/mcp23017/*.c>
    +<../platform/dac8564/*.c>
    +<../platform/fram/*.c>
    +<../platform/midi/*.cpp>
    +<../platform/uclock/*.cpp>
    +<../core/*.cpp>
    +<../devices/sequencer/*.cpp>
    +<../devices/sequencer/chords/*.cpp>
    +<../ui/*.c>
    +<../ui/screens/*.c>
    +<../stm32/sequencer_bridge.cpp>
    +<../stm32/user_chord_bridge.cpp>

[env:genericSTM32F405RG_recovery]
extends = env:genericSTM32F405RG
extra_scripts = pre:scripts/recovery_unlock_only.py
build_src_filter = -<*>
targets = recover_unlock